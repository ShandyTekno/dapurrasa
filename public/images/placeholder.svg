<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#167c4f"/>
      <stop offset="100%" stop-color="#0d5c3a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0d5c3a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#bgGrad)"/>

  <circle cx="100" cy="80" r="120" fill="#0d5c3a" fill-opacity="0.03"/>
  <circle cx="520" cy="320" r="140" fill="#f59e0b" fill-opacity="0.05"/>

  <g filter="url(#shadow)" transform="translate(300, 185)">

    <ellipse cx="0" cy="0" rx="140" ry="85" fill="#ffffff" stroke="#e2d8c3" stroke-width="3"/>
    <ellipse cx="0" cy="-2" rx="118" ry="70" fill="#faf6ed"/>
    <ellipse cx="0" cy="-4" rx="95" ry="55" fill="#ffffff" stroke="#167c4f" stroke-opacity="0.15" stroke-width="2"/>

    <path d="M -70 -12 C -70 -85 70 -85 70 -12 Z" fill="url(#primaryGrad)"/>
    <ellipse cx="0" cy="-12" rx="70" ry="14" fill="#093823"/>

    <circle cx="0" cy="-86" r="13" fill="url(#accentGrad)"/>
    <rect x="-3.5" y="-76" width="7" height="10" fill="url(#accentGrad)"/>

    <path d="M -30 -95 Q -40 -115 -25 -130" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 0 -105 Q 10 -125 0 -142" stroke="#167c4f" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 30 -95 Q 40 -115 25 -130" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <text x="300" y="325" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#0d5c3a" letter-spacing="-0.5">
    Dapur<tspan fill="#f59e0b">Rasa</tspan>
  </text>
  <text x="300" y="350" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#64748b" letter-spacing="1.5">
    CATERING &amp; NASI KOTAK
  </text>
</svg>
